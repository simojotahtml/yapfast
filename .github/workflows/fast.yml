# Fast build artifact: Actions > Fast > Run workflow.
# Builds `target/fast/yapfast` and uploads it as a workflow artifact.
# Not a release, no prerelease tag — just files to download from the run.
name: Fast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - name: Build (fast profile)
        run: nix develop path:./nix --command cargo build --locked --profile fast
      - uses: actions/upload-artifact@v4
        with:
          name: yapfast-fast
          path: target/fast/yapfast
          if-no-files-found: error
          compression-level: 0
